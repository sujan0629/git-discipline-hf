name: cd-demo

on:
  push:
    branches: [main]

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deploy script if present
        run: |
          if [ -f .ci/deploy.sh ]; then
            bash .ci/deploy.sh
          else
            echo "No .ci/deploy.sh found. Add stack/project deploy steps in generated repositories."
          fi

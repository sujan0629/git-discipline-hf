name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  policy-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify template policy docs exist
        run: |
          test -f CONTRIBUTING.md
          test -f SETUP-PLAYBOOK.md

  project-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run project checks if configured
        run: |
          if [ -f .ci/commands.sh ]; then
            bash .ci/commands.sh
          else
            echo "No .ci/commands.sh found. Add it in each generated project to run stack-specific checks."
          fi
